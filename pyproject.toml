[project]
name = "safesf-agent"
version = "0.2.0"
description = "Multi-agent SF safety analysis system using Claude Agent SDK and Snow Leopard API"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "snowleopard>=0.1.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["safesf_agent*"]

[project.scripts]
safesf-agent = "main:main"
safesf-server = "safesf_agent.server:main"
